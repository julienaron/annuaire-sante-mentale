<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16405e"/><stop offset="1" stop-color="#0b1f2e"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e2a92e"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa9d3"/><stop offset="1" stop-color="#2a77a6"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- halo derrière la Vierge -->
  <circle cx="256" cy="118" r="62" fill="#ffd36b" opacity=".16"/>
  <!-- colline de la Garde -->
  <path d="M40 400 C110 392 150 352 196 336 L316 336 C362 352 402 392 472 400 L472 430 L40 430Z" fill="#f2e8d8" opacity=".95"/>
  <!-- basilique : nef, coupole, clocher -->
  <g fill="#f8f3ea">
    <!-- nef et abside -->
    <rect x="148" y="274" width="216" height="66" rx="4"/>
    <!-- coupole sur tambour -->
    <rect x="160" y="246" width="58" height="32" rx="3"/>
    <path d="M158 248 a31 31 0 0 1 62 0Z"/>
    <rect x="186" y="203" width="6" height="16" rx="2"/>
    <!-- clocher -->
    <rect x="226" y="164" width="60" height="116" rx="3"/>
    <rect x="220" y="226" width="72" height="9" rx="2"/>
    <rect x="220" y="156" width="72" height="12" rx="2"/>
    <!-- socle de la statue -->
    <rect x="240" y="136" width="32" height="24" rx="3"/>
  </g>
  <!-- bandes de pierre bicolores -->
  <g fill="#c7a77e" opacity=".55">
    <rect x="148" y="296" width="216" height="6"/>
    <rect x="148" y="316" width="216" height="6"/>
    <rect x="160" y="260" width="58" height="5"/>
  </g>
  <!-- ouvertures -->
  <g fill="#16405e">
    <rect x="236" y="178" width="9" height="34" rx="4.5"/>
    <rect x="251.5" y="178" width="9" height="34" rx="4.5"/>
    <rect x="267" y="178" width="9" height="34" rx="4.5"/>
    <rect x="249" y="248" width="14" height="26" rx="7"/>
    <rect x="290" y="284" width="10" height="20" rx="5"/>
    <rect x="312" y="284" width="10" height="20" rx="5"/>
    <rect x="334" y="284" width="10" height="20" rx="5"/>
    <rect x="168" y="284" width="10" height="20" rx="5"/><rect x="190" y="284" width="10" height="20" rx="5"/>
  </g>
  <!-- la Bonne Mère, statue dorée -->
  <g fill="url(#gold)">
    <path d="M256 70 c-9 0-15 7-15 15 c0 6 3 10 7 13 l-9 36 c-1 4 2 7 6 7 h22 c4 0 7-3 6-7 l-9-36 c4-3 7-7 7-13 c0-8-6-15-15-15z"/>
    <circle cx="256" cy="58" r="5"/>
  </g>
  <!-- mer -->
  <path d="M0 418 C70 402 130 436 200 420 S330 400 400 418 S480 432 512 422 V512 H0Z" fill="url(#sea)"/>
  <path d="M70 458 C120 444 160 468 206 456 S296 442 342 456 S406 468 442 456" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity=".85"/>
</svg>
